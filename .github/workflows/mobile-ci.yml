name: Pure Native Mobile App CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # 1. Pure Native Android Kotlin Build (Runs on Ubuntu)
  # -------------------------------------------------------------
  android-native-build:
    name: Build Pure Native Android (Kotlin) APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Make Gradlew Executable
        run: |
          cd mobile/android
          chmod +x gradlew

      - name: Build Pure Native Kotlin APK
        run: |
          cd mobile/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Pure Native Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RMYC-Pure-Native-Android-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
