name: Mobile App CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  # -------------------------------------------------------------
  # 1. Android APK Build Job (Runs on Ubuntu)
  # -------------------------------------------------------------
  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'
        continue-on-error: true

      - name: Install Mobile Dependencies
        run: |
          if [ -d "mobile" ]; then
            cd mobile && npm ci || npm install
          fi

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android Debug APK
        run: |
          if [ -d "mobile/android" ]; then
            cd mobile/android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          elif [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "Mobile Android directory will compile here once mobile app code is pushed."
          fi

      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RMYC-Mobile-Android-Debug.apk
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: ignore

  # -------------------------------------------------------------
  # 2. iOS Build & Validation Job (Runs on macOS)
  # -------------------------------------------------------------
  ios-build-check:
    name: iOS Build Validation
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mobile Dependencies
        run: |
          if [ -d "mobile" ]; then
            cd mobile && npm ci || npm install
          fi

      - name: Pod Install & Xcode Check
        run: |
          if [ -d "mobile/ios" ]; then
            cd mobile/ios
            pod install
            echo "iOS CocoaPods dependencies verified."
          elif [ -d "ios" ]; then
            cd ios
            pod install
            echo "iOS CocoaPods dependencies verified."
          else
            echo "Mobile iOS directory will be validated here once mobile app code is pushed."
          fi
