name: Mobile App CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  # -------------------------------------------------------------
  # 1. Android APK & Bundle Build (Runs on Ubuntu)
  # -------------------------------------------------------------
  android-build:
    name: Build Android App (APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js Environment (Node 22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm install --legacy-peer-deps

      - name: Make Gradlew Executable
        run: |
          cd mobile/android
          chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          cd mobile/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RMYC-Android-Release-Build
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # -------------------------------------------------------------
  # 2. iOS Build Check (Runs on macOS)
  # -------------------------------------------------------------
  ios-build-check:
    name: iOS App Validation
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (Node 22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm install --legacy-peer-deps

      - name: CocoaPods Install Check
        run: |
          cd mobile/ios
          pod install
          echo "iOS Native Dependencies (CocoaPods) Verified Successfully."
